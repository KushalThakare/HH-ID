<!-- Simple interaction script for preview -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nameInput = document.getElementById('input-name');
            const titleInput = document.getElementById('input-title');
            const companyInput = document.getElementById('input-company');
            
            const prevName = document.getElementById('preview-name');
            const prevTitle = document.getElementById('preview-title');
            const prevCompany = document.getElementById('preview-company');

            // Live updates
            nameInput.addEventListener('input', (e) => {
                prevName.textContent = e.target.value || 'First Lastname';
            });
            titleInput.addEventListener('input', (e) => {
                prevTitle.textContent = e.target.value || 'Job Title';
            });
            companyInput.addEventListener('input', (e) => {
                prevCompany.textContent = e.target.value || 'Acme Corp';
            });

            // Fake Front/Back toggle (just visually scales slightly to indicate interaction)
            const btnFront = document.getElementById('btn-front');
            const btnBack = document.getElementById('btn-back');
            const card = document.getElementById('card-preview');

            btnFront.addEventListener('click', () => {
                btnFront.classList.replace('text-on-surface-variant', 'bg-secondary-container');
                btnFront.classList.add('text-on-secondary-container');
                
                btnBack.classList.replace('bg-secondary-container', 'text-on-surface-variant');
                btnBack.classList.remove('text-on-secondary-container');
                
                card.style.transform = 'scale(1)';
            });

            btnBack.addEventListener('click', () => {
                btnBack.classList.replace('text-on-surface-variant', 'bg-secondary-container');
                btnBack.classList.add('text-on-secondary-container');
                
                btnFront.classList.replace('bg-secondary-container', 'text-on-surface-variant');
                btnFront.classList.remove('text-on-secondary-container');
                
                card.style.transform = 'scale(0.95)';
                // In a real app, this would swap the DOM content of the card
            });
        });
    </script>

<!-- Client-side navigation script injected by Antigravity -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  console.log("Stitch client-side router loaded.");

  // Map header and navigation clicks dynamically based on text or icon attributes
  document.querySelectorAll("button, a").forEach(el => {
    const text = el.textContent.trim().toLowerCase();
    
    // Navigation based on inner text
    if (text === "home" || text === "dashboard") {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "index.html"; 
      });
    } else if (text === "templates") {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "templates.html"; 
      });
    } else if (text === "my cards") {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "my-cards.html"; 
      });
    } else if (text.includes("create new card") || text.includes("use template")) {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "create.html"; 
      });
    } else if (text.includes("next") || text.includes("continue") || text.includes("customize")) {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "customizer.html"; 
      });
    } else if (text.includes("generate") || text.includes("issue") || text.includes("save")) {
      el.addEventListener("click", (e) => { 
        e.preventDefault(); 
        window.location.href = "builder-id.html"; 
      });
    }

    // Navigation based on icons
    const icon = el.querySelector("[data-icon]");
    if (icon) {
      const iconName = icon.getAttribute("data-icon");
      if (iconName === "home") {
        el.addEventListener("click", (e) => { 
          e.preventDefault(); 
          window.location.href = "index.html"; 
        });
      } else if (iconName === "style") {
        el.addEventListener("click", (e) => { 
          e.preventDefault(); 
          window.location.href = "templates.html"; 
        });
      } else if (iconName === "badge") {
        el.addEventListener("click", (e) => { 
          e.preventDefault(); 
          window.location.href = "my-cards.html"; 
        });
      }
    }
  });
});
